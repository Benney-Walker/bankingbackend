spring.application.name=bankingbackend

spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${POSTGRES_ROOT_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

jwt.secret = ${JWT_SECRET}
jwt.access-expiration = ${JWT_ACCESS_EXPIRATION}
jwt.refresh-expiration = ${JWT_REFRESH_EXPIRATION}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=true

# ---------------------------------------------------------------
# RabbitMQ
# ---------------------------------------------------------------
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.connection-timeout=10000
spring.rabbitmq.requested-heartbeat=60

# ---------------------------------------------------------------
# Cloudflare
# ---------------------------------------------------------------
cloudflare.r2.account-id=${CLOUD_FLARE_ID}
cloudflare.r2.access-key=${CLOUD_FLARE_ACCESS_KEY}
cloudflare.r2.secret-key=${CLOUD_FLARE_SECRET_KEY}
cloudflare.r2.bucket-name=kyc-documents
cloudflare.r2.public-url=${PUBLIC_URL}

# AWS Textract Configuration
aws.textract.access-key=${AWS_ACCESS_KEY}
aws.textract.secret-key=${AWS_SECRET_KEY}
aws.textract.region=us-east-1

# ---------------------------------------------------------------
# Vynfy sms config
# ---------------------------------------------------------------
vynfy.sms.url=${VYNFY_SMS_URL}
vynfy.sms.api.key=${VYNFY_API_KEY}
vynfy.sms.sender.id=${VYNFY_SENDER_ID}