spring.application.name=bankingbackend

spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${POSTGRES_ROOT_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

jwt.secret = ${JWT_SECRET}
jwt.access-expiration = ${JWT_ACCESS_EXPIRATION}
jwt.refresh-expiration = ${JWT_REFRESH_EXPIRATION}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=true

# ---------------------------------------------------------------
# RabbitMQ
# ---------------------------------------------------------------
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.connection-timeout=10000
spring.rabbitmq.requested-heartbeat=60

# ---------------------------------------------------------------
# Cloudflare
# ---------------------------------------------------------------
cloudflare.r2.account-id=${CLOUD_FLARE_ID}
cloudflare.r2.access-key=${ACCESS_KEY}
cloudflare.r2.secret-key=${SECRET_KEY}
cloudflare.r2.bucket-name=kyc-documents
cloudflare.r2.public-url=${PUBLIC_URL}