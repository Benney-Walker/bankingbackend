spring.application.name=bankingbackend

spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${POSTGRES_ROOT_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

jwt.secret = ${JWT_SECRET}
jwt.access-expiration = ${JWT_ACCESS_EXPIRATION}
jwt.refresh-expiration = ${JWT_REFRESH_EXPIRATION}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=true

# ---------------------------------------------------------------
# RabbitMQ
# ---------------------------------------------------------------
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.connection-timeout=10000
spring.rabbitmq.requested-heartbeat=60
# Listener retries (roadmap 2.2, owner-approved): a failing message gets 3 retries after the
# first attempt (1s, 2s, 4s apart); then it is rejected and RabbitMQ moves it to its dead-letter
# queue. Spring Boot 4 calls this max-retries (it was max-attempts before).
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
# Safety net: a rejected message is never put back on its queue to loop forever.
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# ---------------------------------------------------------------
# Cloudflare
# ---------------------------------------------------------------
cloudflare.r2.account-id=${CLOUD_FLARE_ID}
cloudflare.r2.access-key=${CLOUD_FLARE_ACCESS_KEY}
cloudflare.r2.secret-key=${CLOUD_FLARE_SECRET_KEY}
cloudflare.r2.bucket-name=kyc-documents
cloudflare.r2.public-url=${PUBLIC_URL}
cloudflare.r2.endpoint=https://${CLOUD_FLARE_ID}.r2.cloudflarestorage.com

# AWS Textract Configuration
aws.textract.access-key=${AWS_ACCESS_KEY}
aws.textract.secret-key=${AWS_SECRET_KEY}
aws.textract.region=us-east-1

# ---------------------------------------------------------------
# Vynfy sms config
# ---------------------------------------------------------------
vynfy.sms.url=${VYNFY_SMS_URL}
vynfy.sms.api.key=${VYNFY_API_KEY}
vynfy.sms.sender.id=${VYNFY_SENDER_ID}
# Browser origins allowed to call the API (comma-separated, no trailing slash).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://project-1q3u6.vercel.app}

# Outbox: how often unsent RabbitMQ messages are retried (ms). Messages are normally sent
# immediately after commit; this only matters when that first send fails.
app.outbox.retry-interval-ms=${OUTBOX_RETRY_INTERVAL_MS:5000}

# KYC uploads (owner decision D9): at most 5 MB per file. Spring's default is 1 MB. The request
# limit leaves room for the other form fields.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
