spring.application.name=bankingbackend

spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${POSTGRES_ROOT_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

jwt.secret = ${JWT_SECRET}
# Defaults: 10 minutes and 24 hours for everyone (owner decision 2026-11-23, D37); the environment can override.
jwt.access-expiration = ${JWT_ACCESS_EXPIRATION:600000}
jwt.refresh-expiration = ${JWT_REFRESH_EXPIRATION:86400000}
jwt.reset-expiration = ${JWT_RESET_EXPIRATION}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=true

# ---------------------------------------------------------------
# RabbitMQ
# ---------------------------------------------------------------
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.connection-timeout=10000
spring.rabbitmq.requested-heartbeat=60
# Listener retries (roadmap 2.2, owner-approved): a failing message gets 3 retries after the
# first attempt (1s, 2s, 4s apart); then it is rejected and RabbitMQ moves it to its dead-letter
# queue. Spring Boot 4 calls this max-retries (it was max-attempts before).
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
# Safety net: a rejected message is never put back on its queue to loop forever.
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# ---------------------------------------------------------------
# Cloudflare
# ---------------------------------------------------------------
cloudflare.r2.account-id=${CLOUD_FLARE_ID}
cloudflare.r2.access-key=${CLOUD_FLARE_ACCESS_KEY}
cloudflare.r2.secret-key=${CLOUD_FLARE_SECRET_KEY}
cloudflare.r2.bucket-name=kyc-documents
cloudflare.r2.public-url=${PUBLIC_URL}
cloudflare.r2.endpoint=https://${CLOUD_FLARE_ID}.r2.cloudflarestorage.com

# AWS Textract Configuration
aws.textract.access-key=${AWS_ACCESS_KEY}
aws.textract.secret-key=${AWS_SECRET_KEY}
aws.textract.region=us-east-1

# ---------------------------------------------------------------
# Vynfy sms config
# ---------------------------------------------------------------
vynfy.sms.url=${VYNFY_SMS_URL}
vynfy.sms.api.key=${VYNFY_API_KEY}
vynfy.sms.sender.id=${VYNFY_SENDER_ID}
# Name printed at the top of account statements (owner decision 2026-11-23). Placeholder until the
# credit union's real name is set per environment.
app.credit-union.name=${CREDIT_UNION_NAME:Credit Union}

# The server's public address, used for the password reset link in the new-staff SMS (owner
# decision 2026-11-24). Set PUBLIC_BASE_URL on Railway, e.g. https://your-app.up.railway.app
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080}

# Browser origins allowed to call the API (comma-separated, no trailing slash).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://project-1q3u6.vercel.app}

# Sessions (owner decisions 2026-11-15): refresh tokens are stored and swapped on every refresh.
# A refresh retried within this many seconds (the app never got the response) gets a new token
# instead of ending the session as a stolen-token reuse. Expired tokens are deleted daily.
app.auth.refresh-retry-grace-seconds=${AUTH_REFRESH_RETRY_GRACE_SECONDS:30}
app.auth.refresh-token-cleanup-cron=${AUTH_REFRESH_TOKEN_CLEANUP_CRON:0 30 3 * * *}

# Collector location points are deleted 90 days after they were taken (owner decision 2026-11-23).
app.collector.location-cleanup-cron=${COLLECTOR_LOCATION_CLEANUP_CRON:0 45 3 * * *}

# When due loan installments are taken from members' accounts each day (Africa/Accra). Late in the
# evening so the day's susu collections are already in (owner decisions 2026-11-24).
app.loan.repayment-cron=${LOAN_REPAYMENT_CRON:0 30 23 * * *}

# Audit log entries older than 7 years are deleted once a day (owner decision 2026-11-24).
app.audit.retention-cron=${AUDIT_RETENTION_CRON:0 15 4 * * *}

# Outbox: how often unsent RabbitMQ messages are retried (ms). Messages are normally sent
# immediately after commit; this only matters when that first send fails.
app.outbox.retry-interval-ms=${OUTBOX_RETRY_INTERVAL_MS:5000}

# KYC uploads (owner decision D9): at most 5 MB per file. Spring's default is 1 MB. The request
# limit leaves room for the other form fields.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ---------------------------------------------------------------
# Actuator (roadmap 9.x). Owner decision 2026-11-07: actuator data is internal, so every
# /actuator endpoint requires an ADMINISTRATOR token (SecurityConfig). Only health and info are
# exposed over HTTP; env, beans, configprops, heapdump and the rest stay off.
# ---------------------------------------------------------------
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
management.endpoint.health.roles=ADMINISTRATOR

# ---------------------------------------------------------------
# API documentation (springdoc): /v3/api-docs and /swagger-ui.html.
# Off unless API_DOCS_ENABLED=true; when on, these pages are public (a browser can't send the
# JWT to load them), so keep it off in production.
# ---------------------------------------------------------------
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}

# Collector payments are applied on arrival (owner decision 2026-11-23). This is how often any
# payment still PENDING from the old 10-minute window is applied.
app.collector.finalize-interval-ms=${COLLECTOR_FINALIZE_INTERVAL_MS:60000}
